<!DOCTYPE html>
<html>
<head>
    <title>Twilio Voice Client</title>
    <script src="/node_modules/@twilio/voice-sdk/dist/twilio.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #controls { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin-right: 10px; }
        #log { margin-top: 20px; border: 1px solid #ccc; padding: 10px; min-height: 100px; overflow-y: scroll; }
    </style>
</head>
<body>
    <h1>Twilio Voice Client</h1>
    <div id="controls">
        <button id="call-button">Call</button>
        <button id="hangup-button" disabled>Hangup</button>
        <p id="status">Connecting...</p>
    </div>
    <div id="log"></div>

    <script>
        const callButton = document.getElementById('call-button');
        const hangupButton = document.getElementById('hangup-button');
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        let device;
        let currentConnection;
        let vadProcessor;

        function log(message) {
            logDiv.innerHTML += `<p>${message}</p>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // VAD Implementation using Twilio's AudioProcessor and AudioWorklet
        class VadAudioProcessor {
            constructor() {
                this.audioContext = null;
                this.microphone = null;
                this.vadNode = null;
            }

            async createProcessedStream(stream) {
                log('VAD Processor: Creating processed stream with AudioWorklet.');
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                try {
                    await this.audioContext.audioWorklet.addModule('vad-processor.js');
                } catch (e) {
                    log(`Error loading VAD processor: ${e.message}`);
                    return stream; // Return original stream if worklet fails
                }

                this.microphone = this.audioContext.createMediaStreamSource(stream);
                this.vadNode = new AudioWorkletNode(this.audioContext, 'vad-processor');

                this.vadNode.port.onmessage = (event) => {
                    if (event.data.event === 'silence') {
                        log('Client-side silence detected (Worklet). Ending turn.');
                        fetch('/end-turn', { method: 'POST' });
                    } else if (event.data.event === 'speechStart') {
                        log('Speech detected (Worklet)...');
                    }
                };

                this.microphone.connect(this.vadNode);

                return stream;
            }

            async destroyProcessedStream(stream) {
                log('VAD Processor: Destroying processed stream.');
                if (this.vadNode) { 
                    this.vadNode.port.postMessage({ type: 'close' });
                    this.vadNode.disconnect();
                }
                if (this.microphone) this.microphone.disconnect();
                if (this.audioContext) this.audioContext.close();
            }
        }

        async function initializeAndConnect() {
            log('Requesting Access Token...');
            try {
                const response = await fetch('/token');
                const data = await response.json();
                log('Got Access Token');

                device = new Twilio.Device(data.token, {
                    codecPreferences: ['opus', 'pcmu'],
                });

                vadProcessor = new VadAudioProcessor();
                device.audio.addProcessor(vadProcessor);

                log('Making call...');
                currentConnection = await device.connect();

                currentConnection.on('accept', (conn) => {
                    statusDiv.textContent = 'In call';
                    callButton.disabled = true;
                    hangupButton.disabled = false;
                    log('Successfully established call');
                });

                currentConnection.on('disconnect', () => {
                    log('Call disconnected');
                    if (vadProcessor) device.audio.removeProcessor(vadProcessor);
                    statusDiv.textContent = 'Ready to make calls';
                    callButton.disabled = false;
                    hangupButton.disabled = true;
                    if (device) device.destroy();
                    currentConnection = null;
                });

                currentConnection.on('cancel', () => {
                    log('Call canceled');
                    if (vadProcessor) device.audio.removeProcessor(vadProcessor);
                    statusDiv.textContent = 'Ready to make calls';
                    callButton.disabled = false;
                    hangupButton.disabled = true;
                    if (device) device.destroy();
                    currentConnection = null;
                });

            } catch (error) {
                log('Could not get Access Token or make call: ' + error.message);
                statusDiv.textContent = 'Error making call';
            }
        }

        // Call button handler
        callButton.addEventListener('click', () => {
            initializeAndConnect();
        });

        // Hangup button handler
        hangupButton.addEventListener('click', () => {
            log('Hanging up...');
            if (currentConnection) {
                currentConnection.disconnect();
            }
        });

        // Initial UI state
        statusDiv.textContent = 'Ready to make calls';
        callButton.disabled = false;
        hangupButton.disabled = true;
        log('Twilio Voice Client initialized.');

    </script>
</body>
</html>
